<script>
// Google Maps API — carregada dinamicamente
// Em produção (Vercel): a chave é injetada pelo servidor via variável GOOGLE_MAPS_API_KEY
// Em uso local (file://): o mapa mostra aviso amigável sem travar a plataforma
(function(){
  const key=window.GOOGLE_MAPS_KEY||"";
  if(key){
    const s=document.createElement("script");
    s.src="https://maps.googleapis.com/maps/api/js?key="+key+"&libraries=geocoding&callback=_gmapsReady";
    s.async=true;s.defer=true;document.head.appendChild(s);
  }
  window._gmapsReady=function(){if(window._onGmapsReady)window._onGmapsReady();};
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;min-height:100vh}
.inp{background:#0D1117;border:1.5px solid #30363D;border-radius:8px;color:#E6EDF3;padding:10px 14px;font-size:16px;font-family:inherit;width:100%;outline:none;transition:border .2s}
.inp:focus{border-color:#D4A017;box-shadow:0 0 0 3px #D4A01720}
.inp::placeholder{color:#6E7681}
.inp.err{border-color:#F09595}
.sel{background:#0D1117;border:1.5px solid #30363D;border-radius:8px;color:#E6EDF3;padding:10px 12px;font-size:16px;font-family:inherit;width:100%;outline:none;cursor:pointer;transition:border .2s}
.sel:focus{border-color:#D4A017}
.ta{background:#0D1117;border:1.5px solid #30363D;border-radius:8px;color:#E6EDF3;padding:10px 14px;font-size:15px;font-family:inherit;width:100%;outline:none;resize:vertical;min-height:72px;transition:border .2s}
.ta:focus{border-color:#D4A017}
.ta::placeholder{color:#6E7681}
.btn{background:#D4A017;color:#0D1117;border:none;border-radius:8px;padding:14px 24px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;width:100%}
.btn:hover{background:#E8B820;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-out{background:transparent;color:#8B949E;border:1.5px solid #30363D;border-radius:8px;padding:13px 24px;font-size:15px;cursor:pointer;font-family:inherit;transition:all .2s;width:100%}
.btn-out:hover{border-color:#D4A017;color:#D4A017}
.btn-dl{background:#27500A;color:#fff;border:none;border-radius:8px;padding:14px 24px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-dl:hover{background:#3B6D11}
.card{background:#161B22;border:1px solid #21262D;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.lbl{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:#8B949E;margin-bottom:6px;display:block}
.em{font-size:11px;color:#F09595;margin-top:4px}
.hint{font-size:14px;color:#9DA7B0;margin-top:4px;line-height:1.5}
.bar-bg{height:6px;background:#21262D;border-radius:10px;overflow:hidden;margin-top:5px}
.bar-fill{height:100%;border-radius:10px;transition:width .6s ease}
.prio-btn{border:1.5px solid #30363D;border-radius:8px;padding:10px 12px;cursor:pointer;background:#0D1117;font-family:inherit;width:100%;text-align:left;transition:all .2s}
.prio-btn:hover{border-color:#D4A017}
.div-line{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.div-line span{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#D4A017;white-space:nowrap}
.div-line::before,.div-line::after{content:'';flex:1;height:1px;background:#21262D}
.alerta{background:#D4A01712;border:1px solid #D4A01740;border-radius:8px;padding:10px 14px;font-size:14px;color:#D4A017;margin-bottom:1rem;line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fade .4s ease}
</style>
</head>

<div id="root"></div>

<script>
// ── MATRIZ ICV+ v1.7 ──────────────────────────────────────────────────────
// ── VERSÃO DESTA PLATAFORMA — atualizar a cada nova geração ──
const BUILD_DATA="27/06/2026 · 17:42";

const CRITERIOS=[
  {id:"sinalizacao",label:"Sinalização",desc:"Ausência, inadequação ou má conservação",destaque:true,
   subcrit:["Placa de PARE","Placa de conversão/direção","MAC-V+ (Dentes de tubarão)","Pintura de solo de PARE","Faixa de pedestre — existência e conservação ★","Faixa de pedestre — posicionamento adequado ★","Setas direcionais","Faixa de retenção / stop bar","Sinalização horizontal legível","Daylighting (eliminar obstáculos visuais na esquina)"],
   nota:"★ Dois subcritérios independentes de faixa: existência/conservação e posicionamento antes do cruzamento."},
  {id:"velocidade",label:"Velocidade praticada",desc:"Excesso ou ausência de moderação",
   subcrit:["Velocidade real praticada (não a da placa)","Veículos a 50–60 km/h sem controle","Ausência de redutores de velocidade"],
   nota:"IA estima pela combinação: perfil visual da via + dados HERE Maps de velocidade operacional histórica."},
  {id:"visibilidade",label:"Visibilidade",desc:"Obstáculos e iluminação deficiente",
   subcrit:["Veículo estacionado bloqueando visibilidade da via preferencial ★","Muro alto","Árvore / vegetação obstruindo","Poste bloqueando visibilidade","Curva fechada","Iluminação noturna insuficiente"],
   nota:"Daylighting: veículo na esquina cria ponto cego, esconde pedestres e reduz tempo de reação."},
  {id:"conflitos",label:"Conflitos veiculares",desc:"Volume e movimentos conflitantes",
   subcrit:["Conversões simultâneas","Cruzamento 4×4 com múltiplos fluxos","Conversão à esquerda sem controle"],
   nota:"Quanto mais conflitos simultâneos, maior a criticidade."},
  {id:"pedestres",label:"Pedestres e ciclistas",desc:"Presença de usuários vulneráveis",
   subcrit:["Escola próxima","Comércio intenso","Ciclovia no entorno","Travessia informal / não sinalizada","Comércio ambulante / feirantes ★"],
   nota:"Alto fluxo vulnerável sem proteção eleva significativamente a criticidade."},
  {id:"geometria",label:"Geometria viária",desc:"Ângulos, largura, raios de curva",
   subcrit:["Ângulo irregular do cruzamento","Largura excessiva das vias","Múltiplas faixas sem canalização","Curvas abertas","Ausência de ilha separadora"],
   nota:"Geometria mal resolvida gera risco estrutural permanente."},
  {id:"ambiente",label:"Ambiente urbano",desc:"Uso do solo e interferências",
   subcrit:["Polo gerador de tráfego intenso","Escola / Hospital nas proximidades","Terminal de transporte","Comércio intenso com carga/descarga","Equipamentos de assistência social (CRAS/CREAS/posto de saúde) ★"],
   nota:"Mais atividade urbana = maior exposição ao risco no cruzamento."},
  {id:"organizacao",label:"Organização operacional",desc:"Falta de medidas mitigadoras",
   subcrit:["Sem tachão / redutor de velocidade","Sem estreitamento viário","Sem pintura de solo","Sem ilha separadora (mão e contra-mão)","Sem ordenamento geral (placas, faixas de retenção, canalização, travessias)"],
   nota:"Se NÃO HÁ NENHUMA medida mitigadora → criticidade máxima (nota 3)."},
  {id:"acessibilidade",label:"Acessibilidade e infraestrutura viária",desc:"Respeito ao pedestre — avaliável por imagem",
   subcrit:["Travessia de pedestres (meio-fio / guia alto)","Rampas para cadeirantes ★","Piso tátil direcional e de alerta ★","Condições da calçada para cadeirantes","Condições de caminhabilidade geral"],
   nota:"Critério com peso alto. Rampa ausente em cruzamento com faixa de pedestre = penalidade alta. Base: ABNT NBR 9050."},
  {id:"campo",label:"Evidências de campo",desc:"Avaliado por indicadores indiretos visíveis nas imagens",campoCampo:true,
   subcrit:["Motoristas não respeitam preferência (induzido por geometria/sinalização)","Iluminação pública (tipo, altura e densidade de postes)","Drenagem / alagamento (sarjetas, bocas de lobo, afundamentos)","Histórico de acidentes (danos em guias, postes amassados, marcas de freada)","Ultrapassagem indevida (geometria + ausência de sinalização)","Relatos / notoriedade pública do cruzamento"],
   nota:"⚠ Estimativa por indicadores indiretos visuais. O técnico confirma in loco com BO/PMCS/DATATRAN."},
  {id:"socioeconomico",label:"Vulnerabilidade Socioeconômica do Entorno",desc:"Critério exclusivo VISTA+ v1.6",destaque:true,
   subcrit:["Densidade de equipamentos públicos essenciais (postos de saúde, CRAS, escolas públicas)","Perfil de mobilidade do entorno — dependência de transporte ativo/coletivo ★","Faixa etária predominante (idosos e crianças)","Taxa de motorização do entorno (domicílios sem veículo)","Presença de comércio informal / ambulantes","Proximidade de equipamentos para PCD (APAE, clínicas)","Indicadores de abandono — ausência de manutenção recente"],
   nota:"★ Critério exclusivo VISTA+ v1.6. Maior vulnerabilidade + maior dependência de deslocamento a pé/bike = maior criticidade."},
  {id:"conectividade",label:"Conectividade com a Rede de Mobilidade Ativa",desc:"Inserção na malha de mobilidade municipal",destaque:true,novo:true,
   subcrit:["Ciclovia/ciclofaixa conectando-se ao cruzamento","Proximidade de parada de transporte público (100–300m)","Inserção em rota de corredor escolar municipal","Continuidade do passeio/calçada até pontos de interesse"],
   nota:"Conecta o VISTA+ ao PlanMob — o cruzamento avaliado dentro da malha de mobilidade, não isoladamente."},
  {id:"resiliencia",label:"Resiliência Climática e Ambiental",desc:"Conforto e segurança ambiental do pedestre",novo:true,
   subcrit:["Arborização e sombreamento da travessia ★","Permeabilidade do solo / área verde próxima","Exposição solar direta no horário de pico","Predominância de superfícies pavimentadas (ilha de calor)"],
   nota:"Avaliável por imagem de satélite (cobertura vegetal). Relevante para cidades de clima quente."},
  {id:"horario",label:"Comportamento de Tráfego por Horário",desc:"Variação temporal de criticidade",destaque:true,novo:true,
   subcrit:["Variação de fluxo no pico escolar (entrada/saída)","Variação de fluxo no pico comercial","Padrão noturno (velocidade × visibilidade reduzida)","Variação sazonal/turística ★"],
   nota:"★ Único critério que captura a dimensão temporal — dados HERE Maps de padrões horários históricos."},
];

const NIVEIS=[
  {label:"BAIXA",cor:"#27500A",bg:"#EAF3DE",max:0.7},
  {label:"MÉDIA",cor:"#8a5a00",bg:"#FEF3C7",max:1.5},
  {label:"ALTA",cor:"#7f2d12",bg:"#FAECE7",max:2.3},
  {label:"EXTREMA",cor:"#791F1F",bg:"#FCEBEB",max:3.0},
];

// ── FATORES DE ALERTA CRÍTICO — dispara selo independente do ICV+ geral quando nota = 3.0 ──
const ALERTA_CRITICO=[
  ["faixa_exist","Ausência de faixa de pedestre"],
  ["vis_carro","Veículo estacionado bloqueia SUA visibilidade do fluxo principal"],
  ["vel_real","Velocidade real praticada excessiva"],
  ["ev_hist","Histórico de acidentes registrado (BO/DATATRAN)"],
];
function alertasCriticos(sc){return ALERTA_CRITICO.filter(([id])=>parseFloat(sc[id])===3.0);}
const PRIOS=[
  {value:"alta",label:"Alta",sub:"Acidente recente",cor:"#FCEBEB",text:"#791F1F",emoji:"🔴"},
  {value:"media",label:"Média",sub:"Queixas recorrentes",cor:"#FEF3C7",text:"#8a5a00",emoji:"🟡"},
  {value:"baixa",label:"Baixa",sub:"Prevenção proativa",cor:"#EAF3DE",text:"#27500A",emoji:"🟢"},
];

// ── MÓDULO IMI — ÍNDICE DE MATURIDADE INSTITUCIONAL (avaliado por município, separado do ICV+) ──
const IMI_SUBCRIT=[
  ["imi_planmob","PlanMob vigente e atualizado (últimos 5 anos)"],
  ["imi_estrutura","Estrutura institucional de trânsito (DEMUTRAN/SMTT)"],
  ["imi_onu","Ações direcionadas à Década de Ação ONU 2021–2030"],
  ["imi_nacto","Ações direcionadas ao Guia Global de Desenho de Ruas (NACTO)"],
  ["imi_orcamento","Execução orçamentária em sinalização (últimos 3 exercícios)"],
  ["imi_manutencao","Capacidade de manutenção contínua de sinalização"],
];
const NIVEIS_IMI=[
  {label:"CRÍTICO",cor:"#791F1F",bg:"#FCEBEB",max:0.7},
  {label:"EM ESTRUTURAÇÃO",cor:"#8a5a00",bg:"#FEF3C7",max:1.5},
  {label:"ESTRUTURADO",cor:"#1A5276",bg:"#DCE9F5",max:2.3},
  {label:"REFERÊNCIA",cor:"#27500A",bg:"#EAF3DE",max:3.0},
];
function nivelImi(score){return NIVEIS_IMI.find(n=>score<=n.max)||NIVEIS_IMI[3];}
function totalImi(imi){const vals=IMI_SUBCRIT.map(s=>imi[s[0]]).filter(v=>v!==null&&v!==undefined&&v!=="N/A").map(parseFloat);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:0;}
const TIPOS=["Rua","Avenida","Travessa","Alameda","Estrada","Rodovia","Outra"];
const UFS=["AC","AL","AM","AP","BA","CE","DF","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"];

function getNivel(s){return NIVEIS.find(n=>s<=n.max)||NIVEIS[3];}

function parseAnalise(text){
  const erroMatch=text.match(/ERRO_CRUZAMENTO:\s*([\s\S]*?)END_ERRO_CRUZAMENTO/);
  if(erroMatch){
    return{erroCruzamento:erroMatch[1].trim()};
  }
  function parseCrit(blockName,endName){
    let crit={};
    const jm=text.match(new RegExp(blockName+":\\s*\\n?([\\s\\S]*?)"+endName));
    try{crit=JSON.parse(jm?.[1]?.trim()||"{}");}
    catch{["sinalizacao","velocidade","visibilidade","conflitos","pedestres","geometria","ambiente","organizacao","acessibilidade","campo","socioeconomico","conectividade","resiliencia","horario"].forEach(k=>{});}
    return crit;
  }
  function parseBlock(blockName,endName){
    const m=text.match(new RegExp(blockName+":\\s*\\n?([\\s\\S]*?)"+endName));
    if(m){try{return JSON.parse(m[1].trim());}catch{return{};}}
    return{};
  }
  const critV1=parseCrit("CRITERIOS_V1_JSON","END_JSON_V1");
  const critV2=parseCrit("CRITERIOS_V2_JSON","END_JSON_V2");
  const subcritV1=parseBlock("SUBCRIT_V1_JSON","END_SUBCRIT_V1");
  const subcritV2=parseBlock("SUBCRIT_V2_JSON","END_SUBCRIT_V2");
  const imi=parseBlock("IMI_JSON","END_IMI");
  const im=text.match(/INTERVENCOES:\s*\n([\s\S]*?)END_INTERVENCOES/);
  const rm=text.match(/RESUMO:\s*\n([\s\S]*?)END_RESUMO/);
  const fm1=text.match(/DIAGNOSTICO_V1:\s*([\s\S]*?)END_DIAGNOSTICO_V1/);
  const fm2=text.match(/DIAGNOSTICO_V2:\s*([\s\S]*?)END_DIAGNOSTICO_V2/);
  return{
    critV1,critV2,subcritV1,subcritV2,imi,
    intervencoes:im?im[1].trim().split("\n")
      .map(l=>l.trim())
      .filter(l=>l.includes("[CUSTO ZERO]")||l.includes("[BAIXO CUSTO]")||l.includes("[MÉDIO CUSTO]"))
      .map(l=>l.replace(/^[-•\d.)\s]+/,"").trim())
      .filter(Boolean):[],
    resumo:rm?rm[1].trim():"",
    diagnosticoV1:fm1?fm1[1].trim():"",
    diagnosticoV2:fm2?fm2[1].trim():"",
  };
}

function gerarLaudo(resultado,nivel){
  const cod="ICV-"+Math.random().toString(36).slice(2,8).toUpperCase();
  const data=new Date().toLocaleString("pt-BR");
  const corN=nivel.label==="BAIXA"?"#27500A":nivel.label==="MÉDIA"?"#8a5a00":nivel.label==="ALTA"?"#7f2d12":"#791F1F";
  const bgN=nivel.label==="BAIXA"?"#EAF3DE":nivel.label==="MÉDIA"?"#FEF3C7":nivel.label==="ALTA"?"#FAECE7":"#FCEBEB";
  const prio=PRIOS.find(p=>p.value===resultado.cruzamento.prioridade)||{label:"Não informado",sub:"",emoji:"⚪",cor:"#30363D",text:"#8B949E"};
  const V1=resultado.cruzamento.rua1,V2=resultado.cruzamento.rua2;
  const niv1=getNivel(resultado.icv1),niv2=getNivel(resultado.icv2);
  const hdr=`<div style="background:#0D1117;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:6px 6px 0 0"><div><span style="font-size:10px;font-weight:700;color:#999;letter-spacing:3px;display:block">MÉTODO</span><span style="font-size:24px;font-weight:900;color:#D4A017;line-height:1">VISTA<span style="color:#fff">+</span></span><div style="font-size:9px;color:#888;margin-top:2px">Plataforma ICV+ · 14 critérios + IMI</div><div style="font-size:10px;color:#D4A017;margin-top:2px;font-weight:700">🕐 Build: ${BUILD_DATA}</div></div><div style="text-align:right;font-size:11px;color:#888"><div style="font-size:13px;font-weight:700;color:#D4A017">${cod}</div><div>${resultado.cruzamento.cidade}/${resultado.cruzamento.uf} · ${prio.emoji} ${prio.label}</div><div>${data}</div></div></div><div style="height:4px;background:#D4A017;margin-bottom:20px;border-radius:0 0 3px 3px"></div>`;
  const imiTot=resultado.imi?totalImi(resultado.imi):0;
  const imiNiv=nivelImi(imiTot);
  const rodape=`<div style="margin-top:20px;border-top:2px solid #D4A017;padding-top:8px;font-size:10px;color:#aaa;line-height:1.7">MÉTODO VISTA+ · Matriz ICV+ (14 critérios) + IMI · Marcos Gomes Rangel · mgr.mar@gmail.com · CNPJ 62.678.856/0001-69<br>Laudo gerado com IA — validação de campo recomendada. Código: <strong style="color:#D4A017">${cod}</strong> · ICV+: <strong>${resultado.total}/3</strong> (${nivel.label}) · IMI: <strong>${imiTot}/3</strong> (${imiNiv.label})</div>`;

  // PG1
  const pg1=hdr+
  `<div style="background:#f5f5f5;border-radius:8px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;border:1px solid #e0e0e0"><div style="flex:1"><div style="font-size:18px;font-weight:700;color:#111;margin-bottom:3px">${V1}</div><div style="font-size:14px;color:#555;margin-bottom:5px">× ${V2}</div><div style="font-size:11px;color:#888">${[resultado.cruzamento.bairro,resultado.cruzamento.cidade+"/"+resultado.cruzamento.uf].filter(Boolean).join(" · ")}</div>${resultado.cruzamento.prioridade?`<span style="display:inline-block;font-size:10px;font-weight:700;padding:2px 10px;border-radius:20px;background:${bgN};color:${corN};margin-top:6px">${prio.emoji} Motivo: ${prio.label} — ${prio.sub}</span>`:""}</div><div style="display:flex;gap:10px;margin-left:16px"><div style="background:${corN};color:#fff;border-radius:10px;padding:12px 16px;text-align:center;min-width:74px"><div style="font-size:9px;opacity:.85">ICV+</div><div style="font-size:36px;font-weight:700;line-height:1">${resultado.total}</div><div style="font-size:10px;font-weight:700;background:rgba(255,255,255,.2);border-radius:8px;padding:2px 6px;margin-top:4px">${nivel.label}</div></div><div style="background:#7B5BA6;color:#fff;border-radius:10px;padding:12px 16px;text-align:center;min-width:74px"><div style="font-size:9px;opacity:.85">IMI</div><div style="font-size:36px;font-weight:700;line-height:1">${imiTot}</div><div style="font-size:9px;font-weight:700;background:rgba(255,255,255,.2);border-radius:8px;padding:2px 6px;margin-top:4px">${imiNiv.label}</div></div></div></div>`+
  (resultado.resumo?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:6px;padding-bottom:3px;border-bottom:2px solid #D4A017">Diagnóstico ICV+</div><div style="background:#fffbe6;border-left:4px solid #D4A017;padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.8;color:#333;border-radius:0 5px 5px 0">${resultado.resumo}</div>`:"")+
  (resultado.diagnosticoV1||resultado.diagnosticoV2?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#8a5a00;margin-bottom:6px;padding-bottom:3px;border-bottom:2px solid #EF9F27">📋 Diagnóstico por Via</div><div style="background:#FEF3C7;border-left:4px solid #EF9F27;padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.8;color:#7B4F00;border-radius:0 5px 5px 0">${resultado.diagnosticoV1?`<strong>Via 1 (${V1}):</strong> ${resultado.diagnosticoV1}<br><br>`:""}${resultado.diagnosticoV2?`<strong>Via 2 (${V2}):</strong> ${resultado.diagnosticoV2}`:""}</div>`:"")+
  (resultado.cruzamento.obs?`<div style="background:#f0f4ff;border:1px solid #c8d4f0;border-radius:5px;padding:10px 14px;margin-bottom:12px;font-size:12px;line-height:1.7;color:#445"><strong>Observações:</strong> ${resultado.cruzamento.obs}</div>`:"")+
  (()=>{
    const al1=alertasCriticos(resultado.subcritV1||{}).map(a=>({...a,via:"1 — "+V1}));
    const al2=alertasCriticos(resultado.subcritV2||{}).map(a=>({...a,via:"2 — "+V2}));
    const todos=[...al1,...al2];
    if(todos.length===0)return"";

   Via local→baixo · coletora→moderado · arterial→2.0–3.0 · rodovia urbana→3.0

3. VISIBILIDADE
   Subcritérios: vis_carro★, vis_muro, vis_arvore, vis_poste, vis_curva, vis_ilum
   ⚠ REGRA DE ATRIBUIÇÃO CRÍTICA para vis_carro: este subcritério pergunta "o que bloqueia a visibilidade de QUEM TRAFEGA NESTA VIA", não "onde está o veículo estacionado fisicamente". Um veículo estacionado na Via 2 pode bloquear a visibilidade de quem vem pela Via 1 (e vice-versa) — neste caso, pontue ALTO o vis_carro DA VIA CUJO MOTORISTA TEM A VISÃO BLOQUEADA, mesmo que o veículo esteja fisicamente estacionado na via cruzada. Não pontue o vis_carro da via onde o veículo está estacionado apenas por ele estar lá — pontue onde o bloqueio de visão realmente ocorre. Esta é a "causa invisível de acidente" central do método VISTA+: o motorista de uma via não vê o fluxo da via cruzada a tempo de frear, por causa de um veículo estacionado na OUTRA via. Se não houver bloqueio de visibilidade para nenhuma das duas vias, pontue baixo (0.0–0.5) ou null em ambas; se há bloqueio para uma via mas não para outra, a nota deve refletir essa assimetria com precisão.
   ⚠ Cada subcritério avalia um obstáculo DIFERENTE e ESPECÍFICO. Se a imagem não mostra muro, marque vis_muro como null — não dê uma nota "de risco geral" para um obstáculo que não existe. Pontue alto APENAS o(s) obstáculo(s) realmente presente(s); os demais ficam null. vis_ilum quase sempre será null em imagens diurnas (sem como avaliar iluminação noturna).

   Subcritérios: conf_conv, conf_4x4, conf_esq

5. PEDESTRES E CICLISTAS
   Subcritérios: ped_escola, ped_comercio, ped_ciclo, ped_informal, ped_ambul★

6. GEOMETRIA VIÁRIA
   Subcritérios: geo_ang, geo_larg, geo_faix, geo_curva, geo_ilha
   ⚠ Avalie apenas o que é visível na geometria física do cruzamento. Se o cruzamento é um ortogonal simples sem curvas, largura excessiva ou múltiplas faixas, os subcritérios correspondentes (geo_curva, geo_larg, geo_faix) ficam null — não são "defeitos potenciais", são caraterísticas ausentes.

   Subcritérios: amb_polo, amb_escola, amb_term, amb_com, amb_assist★

   ⚠ Pontue cada subcritério apenas onde há evidência visual clara de ausência da medida (ex.: rua visivelmente sem qualquer pintura de solo = org_pint alto). Se a imagem não permite confirmar presença/ausência de uma medida específica (ex.: não é possível avaliar se há tachão pela foto disponível), use null para aquele subcritério — NÃO assuma nota máxima (3.0) por padrão. Se nenhum subcritério puder ser avaliado com confiança, o critério inteiro fica null.

    Subcritérios: se_equip, se_mobil★, se_idade, se_motor, se_inform, se_pcd, se_aband

REGRAS DE PONTUAÇÃO — LEIA COM ATENÇÃO, é a causa mais comum de divergência com o laudo de campo:

1. VALORES VÁLIDOS: 0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0 ou null.

2. USE null GENEROSAMENTE — é o comportamento correto, não uma falha. Um técnico em campo só pontua o que ele observa com confiança; ele NÃO inventa uma nota "moderada" para o que não consegue avaliar. Você deve fazer o mesmo. Use null sempre que:
   - O subcritério não é fisicamente aplicável a este cruzamento (ex.: "muro alto" quando não há muro nas imagens, "curva fechada" quando a via é reta).
   - A imagem disponível não mostra evidência suficiente para julgar com confiança (ex.: não dá para ver se há iluminação noturna numa foto diurna; não dá para avaliar "velocidade real praticada" sem veículos em movimento visíveis).
   - O subcritério depende de dado que você não tem e não pode inferir com segurança a partir do contexto (cidade/bairro) informado.
   NÃO force uma nota intermediária "só para preencher". Se ficar em dúvida entre pontuar 1.5 ou usar null, prefira null — é mais honesto e mais alinhado ao padrão de campo.

3. É NORMAL e ESPERADO que critérios inteiros fiquem com TODOS os subcritérios em null quando a categoria simplesmente não se aplica a este cruzamento específico (ex.: "Geometria viária" pode ser irrelevante se o cruzamento é simples e ortogonal sem ângulos/curvas a avaliar; "Organização operacional" pode não ter evidência visual de nenhuma medida mitigadora presente ou ausente). Quando isso ocorrer, retorne o critério GERAL também como null.

4. Onde HÁ evidência visual clara (ex.: presença/ausência de faixa de pedestre, presença de carro estacionado na esquina, presença de rampa), pontue normalmente — não use null para evitar avaliar o que está claramente visível.

5. Notas DIFERENCIADAS entre subcritérios E entre as duas vias quando a realidade física for diferente (ex.: se só a via 2 tem faixa de pedestre, a nota de faixa_exist da via 1 deve refletir essa ausência).

6. null exclui o subcritério da média do critério. A nota GERAL do critério = média dos subcritérios não-nulos. Se TODOS os subcritérios de um critério forem null, o critério GERAL também é null.

// ── HELPERS DOM ────────────────────────────────────────────────────────
function el(tag,props,...ch){
  const e=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else e.setAttribute(k,v);
  });
  ch.flat().forEach(c=>{if(c!=null&&c!==false)e.append(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
function mkInp(key,placeholder,label,req){
  const errs=S.erros,touched=S.touched,f=S.form;
  const inp=el("input",{className:"inp"+(errs[key]&&touched[key]?" err":""),placeholder,id:"inp_"+key});
  inp.value=f[key]||"";
  inp.addEventListener("input",e=>{S.form[key]=e.target.value;if(S.touched[key])S.erros=validar();updateErrs();});
  inp.addEventListener("blur",()=>{S.touched[key]=true;S.erros=validar();updateErrs();});
  const errDiv=el("div",{className:"em",id:"err_"+key,style:{display:errs[key]&&touched[key]?"block":"none"}},"⚠ "+(errs[key]||""));
  return el("div",{style:{marginBottom:"10px"}},
    el("label",{className:"lbl"},label,req?el("span",{style:{color:"#E24B4A"}}," *"):null),
    inp,errDiv
  );
}
function mkSel(key,opts){
  const s=el("select",{className:"sel",id:"sel_"+key},
    ...opts.map(o=>el("option",{value:o},o)));
  s.value=S.form[key]||opts[0];
  s.addEventListener("change",e=>{S.form[key]=e.target.value;});
  return s;
}
function updateErrs(){
  ["rua1","rua2","cidade"].forEach(k=>{
    const inp=document.getElementById("inp_"+k);
    const errDiv=document.getElementById("err_"+k);
    if(inp){inp.className="inp"+(S.erros[k]&&S.touched[k]?" err":"");}
    if(errDiv){errDiv.style.display=S.erros[k]&&S.touched[k]?"block":"none";errDiv.textContent="⚠ "+(S.erros[k]||"");}
  });
  const apiErr=document.getElementById("api_err");
  if(apiErr){apiErr.style.display=S.erros.api?"block":"none";if(S.erros.api)apiErr.textContent=S.erros.api;}
}

  const root=document.getElementById("root");root.innerHTML="";
  // Header
  const hdr=el("div",{style:{borderBottom:"1px solid #21262D",padding:"10px 18px",display:"flex",alignItems:"center",gap:"8px",position:"sticky",top:"0",background:"#0D1117",zIndex:"10"}},
    el("div",{style:{width:"30px",height:"30px",background:"#D4A017",borderRadius:"7px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700",color:"#0D1117"}},"V+"),
    el("div",{},
      el("div",{style:{fontSize:"13px",fontWeight:"600",color:"#E6EDF3"}},
        "MÉTODO ",el("span",{style:{color:"#D4A017"}},"VISTA+"),
        el("span",{style:{fontSize:"11px",color:"#9DA7B0",fontWeight:"400"}}," · Plataforma ICV+")
      ),
      el("div",{style:{fontSize:"10.5px",color:"#9DA7B0"}},"Diagnóstico Socioviário de Cruzamentos Sem Semáforos nas Cidades"),
      el("div",{style:{fontSize:"10px",color:"#D4A017",marginTop:"2px",fontWeight:"600"}},"🕐 Build: "+BUILD_DATA)
    ),
    S.step==="resultado"&&S.resultado?el("div",{style:{marginLeft:"auto",display:"flex",alignItems:"center",gap:"6px"}},
      el("div",{style:{fontSize:"16px",fontWeight:"700",color:getNivel(S.resultado.total).cor}},
        S.resultado.total,el("span",{style:{fontSize:"10px",color:"#9DA7B0"}},"/3")),
      el("div",{style:{fontSize:"10px",fontWeight:"600",padding:"2px 8px",borderRadius:"20px",background:getNivel(S.resultado.total).bg,color:getNivel(S.resultado.total).cor}},
        getNivel(S.resultado.total).label)
    ):null
  );
  const body=el("div",{style:{maxWidth:"680px",margin:"0 auto"}});
  if(S.step==="input")body.append(renderInput());
  else if(S.step==="loading")body.append(renderLoading());
  else if(S.step==="resultado")body.append(renderResultado());
  root.append(hdr,body);
}
render();
</script>
</body>
</html>
